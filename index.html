<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gotcha 😜</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Comic Sans MS", "Trebuchet MS", Arial, sans-serif;
        background: linear-gradient(135deg, #fff4d6, #ffe4ec, #e7f6ff);
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        margin: 0;
        padding: 20px;
        overflow: hidden;
        cursor: pointer;
      }

      .card {
        background: white;
        max-width: 520px;
        padding: 35px 28px;
        border-radius: 28px;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
        border: 3px dashed #ffb703;
        position: relative;
        animation: floatCard 3s ease-in-out infinite;
      }

      @keyframes floatCard {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      h1 {
        font-size: 3rem;
        color: #f97316;
        margin-bottom: 1rem;
      }

      p {
        font-size: 1.15rem;
        line-height: 1.6;
        margin-bottom: 1.4rem;
      }

      .tap-text {
        font-size: 1rem;
        color: #ec4899;
        font-weight: bold;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 0.75;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }

      .main-meme {
        max-width: 360px;
        width: 90%;
        border-radius: 22px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
        margin-top: 15px;
      }

      .cat-meme {
        position: fixed;
        width: 110px;
        height: auto;
        pointer-events: none;
        z-index: 999;
        animation: popCat 1.4s ease-out forwards;
      }

      @keyframes popCat {
        0% {
          transform: scale(0.2) rotate(-15deg);
          opacity: 0;
        }
        20% {
          transform: scale(1.25) rotate(10deg);
          opacity: 1;
        }
        70% {
          transform: scale(1) rotate(-5deg) translateY(-30px);
          opacity: 1;
        }
        100% {
          transform: scale(0.8) rotate(12deg) translateY(-80px);
          opacity: 0;
        }
      }

      .bubble {
        position: fixed;
        pointer-events: none;
        font-size: 1.2rem;
        animation: bubbleUp 1.2s ease-out forwards;
        z-index: 998;
      }

      @keyframes bubbleUp {
        from {
          transform: translateY(0) scale(0.8);
          opacity: 1;
        }
        to {
          transform: translateY(-70px) scale(1.3);
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>🤣 GOTCHA!</h1>

      <p>
        You thought there was free money?<br />
        Hehe nope. The cat already spent it on snacks. 🐟
      </p>

      <p>
        Nothing is free… not even that “$100” you hoped for!<br /><br />
        Work hard, learn new things, and you’ll earn it for real. 💪
        Have a good day nhaaa !!!!
      </p>

      <p class="tap-text">
        Tap anywhere to summon a meme mèo 🐱✨
      </p>

      <img class="main-meme" src="meme.jpg" alt="Funny Meme" />
    </div>

    <script>
      const catMemes = [
        "meme.jpg",
        "cat.gif",
        "cat_cute.gif",
        "meo1.gif",
        "meo2.gif"
      ];

      const funnyTexts = [
        "meow tax 🐾",
        "no refund 😼",
        "try again hehe",
        "the cat says nope",
        "money went brrr"
      ];

      function showCatMeme(x, y) {
        const cat = document.createElement("img");
        const randomCat = catMemes[Math.floor(Math.random() * catMemes.length)];

        cat.src = randomCat;
        cat.className = "cat-meme";
        cat.style.left = x - 55 + "px";
        cat.style.top = y - 55 + "px";

        document.body.appendChild(cat);

        setTimeout(() => {
          cat.remove();
        }, 1400);
      }

      function showFunnyBubble(x, y) {
        const bubble = document.createElement("div");
        const randomText =
          funnyTexts[Math.floor(Math.random() * funnyTexts.length)];

        bubble.className = "bubble";
        bubble.textContent = randomText;
        bubble.style.left = x + 20 + "px";
        bubble.style.top = y - 20 + "px";

        document.body.appendChild(bubble);

        setTimeout(() => {
          bubble.remove();
        }, 1200);
      }

      document.addEventListener("click", function (event) {
        showCatMeme(event.clientX, event.clientY);
        showFunnyBubble(event.clientX, event.clientY);
      });

      document.addEventListener("touchstart", function (event) {
        const touch = event.touches[0];
        showCatMeme(touch.clientX, touch.clientY);
        showFunnyBubble(touch.clientX, touch.clientY);
      });
    </script>
  </body>
</html>
